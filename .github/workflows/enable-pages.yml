name: Enable GitHub Pages

# One-shot setup: GitHub Pages must be enabled with pages:write, which the
# cloud-agent token does not have. The Actions GITHUB_TOKEN can.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-pages.yml

permissions:
  pages: write
  id-token: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from branch main, folder /
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          payload='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          call() {
            curl -sS -o /tmp/pages-body.json -w "%{http_code}" \
              -X "$1" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${repo}/pages" \
              -d "${payload}"
          }
          code="$(call POST)"
          echo "POST /pages -> ${code}"
          cat /tmp/pages-body.json
          echo
          if [ "${code}" = "409" ]; then
            code="$(call PUT)"
            echo "PUT /pages -> ${code}"
            cat /tmp/pages-body.json
            echo
          fi
          case "${code}" in
            200|201) ;;
            *) exit 1 ;;
          esac
          echo "--- site ---"
          curl -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${repo}/pages"
          echo
